<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neuro Search — sign in</title>
<style>
  body{margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:#0f1115;color:#e6e6e6;display:flex;min-height:100vh;align-items:center;justify-content:center}
  form{background:#171a21;padding:28px;border-radius:14px;width:min(360px,90vw);box-shadow:0 10px 40px #0008}
  h1{font-size:20px;margin:0 0 14px}
  input{width:100%;box-sizing:border-box;padding:12px;border-radius:8px;border:1px solid #2a2f3a;background:#0f1115;color:#fff;font-size:16px}
  button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:8px;background:#4f7cff;color:#fff;font-size:16px}
  .err{color:#ff7b7b}
</style></head><body>
<form method="post" action="/login">
  <h1>Neuro Search</h1>
  <!--ERR-->
  <input type="password" name="token" placeholder="Access token" autofocus>
  <button>Sign in</button>
</form>
</body></html>
