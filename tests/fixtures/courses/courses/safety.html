<!doctype html><html><head><title>Safety</title></head><body><script>window.__clicks=[];document.addEventListener("click",e=>{const b=e.target.closest("button,a");if(b)window.__clicks.push((b.textContent||"").replace(/\s+/g," ").trim().slice(0,60));},true);</script>
<main><h2 id="h">Course</h2><div id="body"></div><div id="list"></div>
<form action="/buy"><button>Purchase</button><button type="submit">Pay now</button></form></main>
<script>
const list=document.getElementById('list');
const rows=[["1. Welcome 3m","0000111100001111000011110000aaaa"],["Complete lesson"],["2. Purchase the full course 10m"],["3. Take quiz"],["Download certificate"],["Save"],["Next"],["Logout"],["Submit quiz"],["Mark complete"],["Start course"],["4. Closing thoughts 6m","0000444400004444000044440000bbbb"],["Delete my account"]];
rows.forEach(([t,id],k)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{ if(id){document.getElementById('h').textContent='Lesson · '+t;document.getElementById('body').innerHTML='<iframe src="https://www.loom.com/embed/'+id+'"></iframe>';} else {document.getElementById('h').textContent='DANGER '+t;} };list.appendChild(b);});
</script></body></html>
