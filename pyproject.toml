[project]
name = "neurosearch"
version = "0.32.0"
description = "Turn videos, podcasts and audio into a queryable, citation-backed knowledge base."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "yt-dlp>=2025.1.1",
    "anthropic>=0.40",
    "openai>=1.50",
    "numpy>=1.26",
    "mcp>=1.10",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "typer>=0.12",
    "python-multipart>=0.0.9",
    "pypdf>=4.0",
    "jsonschema>=4.20",
    "openpyxl>=3.1",
    "formulas[excel]>=1.2",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
neurosearch = "neurosearch.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["neurosearch*"]

[tool.setuptools.package-data]
neurosearch = ["web/*"]
