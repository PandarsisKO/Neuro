# HISTORICAL / UNSUPPORTED. The current product is local and single-user; public deployment lacks a project-scoped
# authorization boundary. Preserved for evidence only. See PRODUCT-SCHEDULER.md before any cloud work.
# Former Fly.io setup:
#   fly launch --no-deploy --copy-config --name <your-app-name>
#   fly volumes create ns_data --size 3 --region sjc
#   fly secrets set ANTHROPIC_API_KEY=... OPENAI_API_KEY=... NEUROSEARCH_APP_TOKEN=...
#   fly deploy
app = "neurosearch"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  NEUROSEARCH_DATA_DIR = "/data"
  NEUROSEARCH_WORKERS = "2"

[[mounts]]
  source = "ns_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false   # keep running so background ingest jobs finish
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 50
    hard_limit = 100

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
